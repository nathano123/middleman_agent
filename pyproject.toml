[project]
name = "agent-broker"
version = "0.0.1"
description = "Local gate between AI agents and Gmail / Google Calendar (v0 validation prototype)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
broker = "broker.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["broker", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
