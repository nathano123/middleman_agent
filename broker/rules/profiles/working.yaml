name: working
description: Default. Reads are allowed, every send asks, outside invites ask, taint makes calendar writes ask.
rules:
  - {tool: search_mail, resource: mail, decision: allow, reason: "search returns headers and snippet only"}
  - {tool: read_message, resource: mail, decision: allow_redacted, reason: "message body is returned with personal data masked"}
  - {tool: list_events, resource: calendar, decision: allow, reason: "listing events is read-only"}
  - {tool: draft_reply, resource: mail, decision: allow, reason: "drafts are never sent"}
  - {tool: send_mail, resource: mail, decision: ask, reason: "every send needs approval"}
  - {tool: create_event, resource: calendar, when: {own_calendar: true}, decision: allow, reason: "event on own calendar"}
  - {tool: create_event, resource: calendar, when: {outside_attendees: true}, decision: ask, reason: "invite goes to outside attendees"}
  - {tool: create_event, resource: calendar, when: {tainted: true}, decision: ask, reason: "session read untrusted content"}
