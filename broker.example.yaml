# Copy to ~/.agent-broker/config.yaml and edit. Settings only; rules live in the profile files.
own_address: me@home.test
self_addresses: [me.work@office.test]       # your other addresses; mail from them never taints
known_contacts: [alice@work.test, bob@work.test]
profile: working                             # cautious | working | autonomous
mode: enforce                                # enforce | watch (watch logs would-have, never blocks)
agents: {}                                   # label -> id; add with `broker agents add <label>`
taint_quiet_hours: 24                        # taint expires after this long with no new taint
full_view_body_chars: 2000                   # tainted + longer body: must open full body to approve
full_view_after_approvals: 10                # after this many prompts per agent per day, same rule
state_dir: ~/.agent-broker                   # audit.db, taint.db, counters.json
phone: none                                  # none | telegram (run `broker phone setup` first)
dev_cli_approvals: false                     # true lets `broker approvals approve` work with a phone
